name: Deploy Telegram Bot to Railway on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/bot/**" # Adjust if the Telegram bot lives in a different directory
      - "packages/**"
      - "turbo.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"

permissions:
  contents: read
  pull-requests: write # Required for PR comments/annotations used for notifications

env:
  PNPM_VERSION: 8.15.6 # Keep in sync with the workspace packageManager field

jobs:
  build-and-deploy:
    name: Build & Deploy Telegram Bot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: telegram-bot-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history is useful for Turborepo's hashing and Railway metadata

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*' # Uses the latest LTS release per the ticket requirements
          cache: 'pnpm'
          check-latest: true

      - name: Configure PNPM store path
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Cache PNPM store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turborepo build artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Telegram bot
        run: pnpm turbo run build --filter=@weship/bot
        env:
          TURBO_TELEMETRY_DISABLED: '1' # Opt out of telemetry for security/privacy best practices

      - name: Archive build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-bot-dist
          path: apps/bot/dist
          if-no-files-found: warn

      - name: Deploy preview to Railway
        if: success()
        uses: railwayapp/cli-action@v3
        with:
          railwayToken: ${{ secrets.RAILWAY_TOKEN }}
          # Replace `telegram-bot` with the actual Railway service name if it differs
          command: up --service telegram-bot --environment preview
        env:
          # The Railway CLI reads RAILWAY_TOKEN; keeping scope limited to this step for security
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Post deployment summary
        if: success()
        run: |
          {
            echo "## 🚀 Telegram Bot preview deployed";
            echo "- PR: #${{ github.event.pull_request.number }}";
            echo "- Commit: ${{ github.sha }}";
            echo "- Railway Environment: preview";
            echo "\n> Replace with the actual preview URL if Railway returns one via CLI output.";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Telegram bot deployment failed. Review previous logs for details.')
            const summary = `### ❌ Telegram Bot preview deployment failed\n- PR: #${{ github.event.pull_request.number }}\n- Commit: ${{ github.sha }}\n\nPlease review the workflow logs for error details.`
            core.summary.addRaw(summary, true)
            await core.summary.write()
